[project]
name = "meetscribe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "duckdb>=2.0.0",
    "pyarrow>=26.0.1",
]

[project.scripts]
meetscribe = "meetscribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
