[project]
name = "meetscribe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "duckdb>=2.0.0",
    "huggingface_hub",
    "mcp>=2.3,<3",
    "numpy",
    "openvino-genai==2026.4.*",
    "pyannote.audio>=4,<5",
    "pyarrow>=26.0.1",
    "sounddevice",
    "soundfile",
    "torch",
    "tzdata>=2026.6",
]

[project.optional-dependencies]
faster-whisper = [
    "faster-whisper>=1.2,<2",
]

[project.scripts]
meetscribe = "meetscribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
